services:
  postgres:
    image: postgres:15-alpine
    container_name: diorama_db
    environment:
      POSTGRES_USER: diorama_admin
      POSTGRES_PASSWORD: diorama_password
      POSTGRES_DB: diorama_db
    ports:
      - "5432:5432"
    volumes:
      - diorama_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diorama_admin -d diorama_db"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["mail"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  diorama_pg_data:
